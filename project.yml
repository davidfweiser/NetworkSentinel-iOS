name: NetworkSentinel
options:
  bundleIdPrefix: com.davidfweiser
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 11
    MARKETING_VERSION: "1.5.0"
    DEVELOPMENT_TEAM: R27KU7BQMW
targets:
  NetworkSentinel:
    type: application
    platform: iOS
    sources:
      - path: NetworkSentinel
        excludes:
          - "**/.DS_Store"
          # Referenced via CODE_SIGN_ENTITLEMENTS; must not be copied into the bundle.
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidfweiser.NetworkSentinel
        CODE_SIGN_ENTITLEMENTS: NetworkSentinel/NetworkSentinel.entitlements
        PRODUCT_NAME: NetworkSentinel
        INFOPLIST_KEY_CFBundleDisplayName: Network Sentinel
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Network Sentinel connects to your Network Sentinel web servers on the local network.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: NetworkSentinel/Info.plist
      properties:
        CFBundleDisplayName: Network Sentinel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Network Sentinel connects to your Network Sentinel web servers on the local network.
        # Scoped in 1.3.1: the app talks to LAN consoles over plain HTTP, and
        # normalizes scheme-less public hostnames to https. Arbitrary loads is wider
        # than that and was never needed.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.davidfweiser.NetworkSentinel.refresh
